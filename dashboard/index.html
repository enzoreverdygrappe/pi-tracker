<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ESNIA — Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">ESNIA</span>
        <span class="brand-sub">Personal Tracker</span>
      </div>
      <div class="topbar-right">
        <button type="button" id="theme-button" class="theme-button">
          <span class="theme-glyph">◐</span>
          <span id="theme-label">Esnia</span>
        </button>
        <div class="clock">
          <span id="clock-time">--:--</span>
          <span id="clock-date">—</span>
        </div>
      </div>
    </header>

    <main id="view-container" class="view-container" aria-live="polite"></main>

    <nav id="tab-bar" class="tab-bar" aria-label="Navigation des vues"></nav>
  </div>

  <div id="chart-tooltip" class="chart-tooltip" hidden></div>

  <script src="js/core.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/views/claude.js"></script>
  <script src="js/views/crypto.js"></script>
  <script src="js/views/fitness.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
