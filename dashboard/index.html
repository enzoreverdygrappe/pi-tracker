<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ENSIA · Tracker</title>
  <!-- Google Fonts (charte ENSIA v2) : si le kiosque est hors ligne,
       les fallbacks locaux de style.css prennent le relais. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="assets/ensia-logo-inverse.svg" alt="ENSIA">
        <span class="brand-sub">Tracker</span>
      </div>
      <div class="topbar-right">
        <div class="clock">
          <span id="clock-time">--:--</span>
          <span id="clock-date">--</span>
        </div>
      </div>
    </header>

    <main id="view-container" class="view-container" aria-live="polite"></main>

    <nav id="tab-bar" class="tab-bar" aria-label="Navigation des vues"></nav>
  </div>

  <div id="chart-tooltip" class="chart-tooltip" hidden></div>

  <script src="js/core.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/weather-icons.js"></script>
  <script src="js/views/claude.js"></script>
  <script src="js/views/goal.js"></script>
  <script src="js/views/whoop.js"></script>
  <script src="js/views/agenda.js"></script>
  <script src="js/views/meteo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
